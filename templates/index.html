<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史冷知识 · 批判性思考</title>
<style>
  :root {
    --bg: #f7f3ea;
    --card: #fffdf8;
    --text: #2b2620;
    --muted: #6f665a;
    --border: #e4dccb;
    --accent: #9a4a1c;
    --accent-soft: #f3e3d6;
    --ok: #2f6b3a;
    --ok-soft: #e0efe2;
    --warn: #8a5a00;
    --warn-soft: #f6ebcf;
    --legend: #5b4a8a;
    --legend-soft: #e8e3f4;
    --error: #a12a2a;
    --error-soft: #f8e1e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916;
      --card: #24211d;
      --text: #ece6da;
      --muted: #a69c8d;
      --border: #3a352e;
      --accent: #e39a6a;
      --accent-soft: #3a2a20;
      --ok: #8fcf99;
      --ok-soft: #223525;
      --warn: #e8c069;
      --warn-soft: #3a3020;
      --legend: #b7a6ec;
      --legend-soft: #2e2840;
      --error: #f09a9a;
      --error-soft: #3d2222;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.7;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: 0.02em; }
  header p { margin: 0; color: var(--muted); }
  .demo-banner {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    background: var(--warn-soft); color: var(--warn); font-size: 0.92rem;
  }
  form {
    margin-top: 24px; padding: 20px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--card);
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] {
    flex: 1 1 240px; min-width: 0; font: inherit; font-size: 1.05rem;
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; padding: 10px 22px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--card); cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .options { margin-top: 12px; display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 0.92rem; }
  .options label { display: flex; align-items: center; gap: 6px; }
  select {
    font: inherit; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .chips { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 0.85rem; font-weight: 400; padding: 4px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  #status { margin: 24px 0 0; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--error); background: var(--error-soft); padding: 10px 14px; border-radius: 8px; }
  .fact {
    margin-top: 20px; padding: 22px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--card);
  }
  .fact h2 { margin: 0; font-size: 1.3rem; }
  .meta { margin-top: 4px; color: var(--muted); font-size: 0.9rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
  .badge.well_documented { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
  .badge.debated { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
  .badge.legendary { background: var(--legend-soft); color: var(--legend); border: 1px solid var(--legend); }
  .fact-body { margin: 14px 0 0; }
  .note { margin: 10px 0 0; font-size: 0.92rem; color: var(--muted); }
  .note b { color: var(--text); font-weight: 600; }
  details {
    margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px;
  }
  summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .responses { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  .responses li { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; }
  .angle { display: block; font-size: 0.8rem; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
  .question { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>📜 历史冷知识 · 批判性思考</h1>
    <p>输入一个关键词，获得几条有趣的历史事实，以及从不同角度出发的 critical thinking 回应。</p>
    {% if demo %}
    <div class="demo-banner">演示模式：没有调用 AI，无论输入什么都会显示同一份示例（关键词“咖啡”）。设置 ANTHROPIC_API_KEY 后去掉 --demo 即可真正生成。</div>
    {% endif %}
  </header>

  <form id="form">
    <div class="row">
      <input id="keyword" type="text" placeholder="比如：咖啡、丝绸之路、猫、印刷术…" maxlength="{{ max_keyword_length }}" autocomplete="off" required>
      <button id="submit" type="submit">生成</button>
    </div>
    <div class="options">
      <label>条数
        <select id="count">
          {% for n in range(min_facts, max_facts + 1) %}
          <option value="{{ n }}" {% if n == default_facts %}selected{% endif %}>{{ n }}</option>
          {% endfor %}
        </select>
      </label>
      <label>输出语言
        <select id="language">
          <option value="zh" selected>中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <div class="chips">
      {% for k in ["咖啡", "丝绸之路", "猫", "印刷术", "罗马", "茶叶", "瘟疫"] %}
      <button type="button" class="chip">{{ k }}</button>
      {% endfor %}
    </div>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <section id="results"></section>

  <footer>内容由 AI 生成，可能有误。请把“可信度”和“如何核实”当作思考的起点，而不是终点。</footer>
</main>

<script>
const ANGLE_LABELS = {{ angle_labels | tojson }};
const RELIABILITY_LABELS = {{ reliability_labels | tojson }};
const UI = {
  zh: { why: "💡 有趣在哪", reliability: "🔎 可信度", think: "🧠 先自己想一想，再展开看批判性思考回应",
        question: "❓ 留给你的问题", verify: "📚 如何核实" },
  en: { why: "💡 Why it matters", reliability: "🔎 Reliability", think: "🧠 Think first, then reveal the critical-thinking responses",
        question: "❓ Your turn", verify: "📚 How to verify" },
};

const form = document.getElementById("form");
const keywordInput = document.getElementById("keyword");
const submitBtn = document.getElementById("submit");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;  // textContent：防止 AI 输出被当作 HTML 执行
  return node;
}

function labeled(label, text, cls = "note") {
  const p = el("p", { class: cls });
  p.append(el("b", {}, label + "："), document.createTextNode(text));
  return p;
}

function renderFact(fact, lang) {
  const ui = UI[lang];
  const card = el("article", { class: "fact" });
  card.append(el("h2", {}, fact.title));

  const meta = el("div", { class: "meta" });
  meta.append(el("span", {}, `${fact.era} · ${fact.place}`));
  meta.append(el("span", { class: `badge ${fact.reliability}` }, RELIABILITY_LABELS[lang][fact.reliability]));
  card.append(meta);

  card.append(el("p", { class: "fact-body" }, fact.fact));
  card.append(labeled(ui.why, fact.why_interesting));
  card.append(labeled(ui.reliability, fact.reliability_note));

  const details = el("details");
  details.append(el("summary", {}, ui.think));
  const list = el("ul", { class: "responses" });
  for (const r of fact.critical_responses) {
    const li = el("li");
    li.append(el("span", { class: "angle" }, ANGLE_LABELS[lang][r.angle] || r.angle));
    li.append(document.createTextNode(r.response));
    list.append(li);
  }
  details.append(list);
  card.append(details);

  card.append(labeled(ui.question, fact.discussion_question, "question"));
  card.append(labeled(ui.verify, fact.how_to_verify));
  return card;
}

async function generate() {
  const keyword = keywordInput.value.trim();
  if (!keyword) { keywordInput.focus(); return; }
  const lang = document.getElementById("language").value;
  submitBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "正在翻阅史书……通常需要几十秒。";
  resultsEl.replaceChildren();
  try {
    const resp = await fetch("/api/facts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keyword, count: Number(document.getElementById("count").value), language: lang }),
    });
    const data = await resp.json().catch(() => ({ error: `服务器返回了意外的响应（${resp.status}）` }));
    if (!resp.ok) throw new Error(data.error || `请求失败（${resp.status}）`);
    const renderLang = data.demo ? "zh" : lang;
    statusEl.textContent = renderLang === "zh"
      ? `关于“${data.keyword}”的 ${data.facts.length} 条历史事实：`
      : `${data.facts.length} historical facts about “${data.keyword}”:`;
    resultsEl.replaceChildren(...data.facts.map(f => renderFact(f, renderLang)));
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
}

form.addEventListener("submit", e => { e.preventDefault(); generate(); });
document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
  keywordInput.value = chip.textContent;
  generate();
}));
</script>
</body>
</html>
